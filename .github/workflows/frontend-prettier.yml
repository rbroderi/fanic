name: Frontend Prettier

on:
  push:
    paths:
      - "frontend/**/*.ts"
      - ".prettierrc.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-prettier.yml"
  pull_request:
    paths:
      - "frontend/**/*.ts"
      - ".prettierrc.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-prettier.yml"

jobs:
  frontend-prettier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run prettier write
        run: npm run frontend:format

      - name: Ensure no formatting changes are pending
        run: git diff --exit-code
