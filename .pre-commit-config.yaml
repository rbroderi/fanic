repos:
  - repo: local
    hooks:
      - id: set-source-permissions
        name: set-source-permissions
        entry: bash scripts/set-source-permissions.sh src
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: forbid-fanic-db
        name: forbid-fanic-db
        entry: bash scripts/forbid-fanic-db.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: sync-static-from-storage
        name: sync-static-from-storage
        entry: bash static/sync-from-storage.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: autopep695-format
        name: autopep695-format
        entry: uvx autopep695 format
        language: system
        files: ^(src|tests)/.*\.py$
        stages: [pre-commit]

      - id: pyupgrade
        name: pyupgrade-py314
        entry: uvx pyupgrade --py314-plus --keep-runtime-typing
        language: system
        files: ^(src|tests)/.*\.py$
        stages: [pre-commit]

      - id: pycln
        name: pycln
        entry: uvx pycln src tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: vulture
        name: vulture
        entry: uvx vulture src --min-confidence 80 --ignore-names dst,secure,httponly,samesite
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: deptry
        name: deptry
        entry: uvx deptry . --known-first-party fanic --ignore DEP002 --package-module-name-map open-clip-torch=open_clip,pillow-avif-plugin=pillow_avif|pillow_avif_plugin,pillow=PIL
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: refurb
        name: refurb
        entry: uvx ruff check --select FURB --ignore FURB110 src tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-ci
        name: ruff-precommit
        entry: just ruff-precommit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: basedpyright
        name: basedpyright
        entry: uvx basedpyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: frontend-prettier
        name: frontend-prettier-write
        entry: just frontend-format
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: frontend-eslint
        name: frontend-eslint
        entry: just frontend-lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: comicinfo-xsd
        name: comicinfo-xsd-v2-check
        entry: uvx --with xmlschema python scripts/validate_comicinfo_xsd.py
        language: system
        files: (^|.*[\\/])([Cc]omic[Ii]nfo|[Cc]omic[Bb]ook[Ii]nfo)\.xml$
        stages: [pre-commit]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline", "--exclude-files", "(^logs/|^extern/)"]
        stages: [pre-commit]
