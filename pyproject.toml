[project]
name = "fanic"
version = "0.1.0"
description = "FANIC: Fan Archive Nexus for Illustrated Comics"
readme = "README.md"
authors = [{ name = "rbroderi", email = "richard.broderick@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
  "alive-progress>=3.3.0",
  "authlib>=1.3.0",
  "gunicorn>=23.0.0",
  "defusedxml>=0.7.1",
  "cylinder>=0.1.0",
  "pillow-avif-plugin>=1.4.6",
  "python-dotenv>=1.0.1",
  "pillow>=11.3.0",
  "tomli-w>=1.2.0",
  "open-clip-torch>=3.3.0",
  "torch>=2.10.0",
  "pathvalidate>=3.3.1",
  "openai>=1.109.0",
  "beartype>=0.22.9",
  "pydantic>=2.12.5",
  "pydantic-settings>=2.11.0",
  "lazi>=1.9.161",
  "structlog>=25.5.0",
  "xmlschema>=4.3.1",
  "niquests>=3.18.4",
  "requests>=2.32.5",          #required for authlib
]

[project.optional-dependencies]
dev = [
  "autopep695>=1.1.4",
  "basedpyright>=1.39.0",
  "prek>=0.3.8",
  "pytest>=9.0.2",
  "pytest-cov>=7.1.0",
  "pytest-sugar>=1.1.1",
  "rust-just>=1.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
reportUnusedCallResult = "none"
reportAny = "none"
reportExplicitAny = "none"
reportImplicitStringConcatenation = "none"

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
force-single-line = true

[tool.coverage.run]
omit = ["src/fanic/main.py"]

[tool.ty.src]
exclude = ["typings"]
