# FANIC default runtime configuration.
# Environment variables (FANIC_*) still override these values.

# Core environment and request safety.
csrf_protect = true
environment = "production" #"development"
require_https = true

# Storage locations and DB path.
data_dir = "/mnt/storage"
db_path = "/opt/fanic/runtime/fanic.db"

# Runtime behavior, logging, and media base URL.
enable_beartype = true
log_path_template = "/var/log/fanic/%TIMESTAMP%.log"
media_base_url = "https://fanic.media"
# Optional CDN host for /static/* media URLs (covers/pages/fanart). Leave empty to disable.
media_cdn_base_url = "https://media.fanic.media"
# Media backend: local (filesystem) or bunny (Bunny Storage API).
media_backend = "bunny"
# Bunny Storage settings (used when media_backend = "bunny").
media_bunny_storage_zone = "fanicmedia"
media_bunny_pull_zone = "fanicmedia"
media_bunny_storage_api_base_url = "https://ny.storage.bunnycdn.com"
# Prefer using RO key for reads and RW key for writes/deletes.
media_bunny_api_key_ro = ""
media_bunny_api_key_rw = ""
media_bunny_upload_workers = 8
media_bunny_skip_exists_check = true
media_bunny_timeout_seconds = 30.0
allowed_hosts_csv = "fanic.media,media.fanic.media"
profile_history_limit = 100

# Session cookie behavior.
session_cookie_samesite = "Lax"
session_max_age = 43200
session_secure = false

# Invite gate controls.
alpha_invite_cookie_max_age = 2592000
alpha_invite_gate_enabled = true

# Auth0 identity provider integration.
auth0_callback_url = "https://fanic.media/account/callback"
auth0_connection = "Username-Password-Authentication"
auth0_enabled = true
auth0_logout_return_url = "https://fanic.media/account/logged-out"
auth0_superadmin_email = "admin@fanic.media"

# Authentication, throttling, and ingest queue limits.
auth_lockout_seconds = 900
auth_max_failures = 5
auth_window_seconds = 300
comic_ingest_max_concurrent = 2
comic_ingest_queue_wait_seconds = 180
upload_max_concurrent_per_user = 1
upload_rate_max_requests = 20
upload_rate_window_seconds = 60

# Upload and ingest size/count limits.
max_cbz_member_uncompressed_bytes = "256 MiB"
max_cbz_total_uncompressed_bytes = "2 GiB"
max_cbz_upload_bytes = "256 MiB"
max_ingest_pages = 2000
max_page_upload_bytes = "50 MiB"
max_upload_image_pixels = 54000000            # 20*300 x 30*300
user_page_quality_ramp_multiplier = 1.5
user_page_soft_cap = 2000

# Allowed upload file extensions and content types.
allowed_cbz_content_types_csv = "application/zip,application/x-cbz,application/octet-stream"
allowed_cbz_extensions_csv = ".cbz"
allowed_page_content_types_csv = "application/octet-stream,image/avif,image/bmp,image/gif,image/jpeg,image/png,image/tiff,image/webp"
allowed_page_extensions_csv = ".avif,.bmp,.gif,.jpeg,.jpg,.png,.tif,.tiff,.webp"

# Moderation and model scoring thresholds.
image_avif_quality = 60
model_load_logs = true
moderation_sidecar_timeout_seconds = 60
moderation_sidecar_token = ""
moderation_sidecar_url = "unix:/run/fanic/fanic-moderation.sock"
nsfw_logit_scale = 100.0
openclip_cache_dir = "~/.cache/clip"
photo_block_min_margin = 0.01
photoreal_min_confidence = 0.6
preload_models = true
style_load_retry_seconds = 5.0
style_logit_scale = 100.0
style_min_confidence = 0.6
style_min_confidence_photorealistic = 0.7
style_max_confidence_photorealistic = 0.9
explicit_min_threshold = 0.8
explicit_max_threshold = 0.9
style_min_top_margin = 0.05
style_min_top_prob = 0.34
thumbnail_avif_quality = 30
thumbnail_max_size = "720x720"
