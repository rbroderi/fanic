name: Frontend TypeScript

on:
  push:
    paths:
      - "frontend/**/*.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.dev.json"
      - ".github/workflows/frontend-typescript.yml"
  pull_request:
    paths:
      - "frontend/**/*.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.dev.json"
      - ".github/workflows/frontend-typescript.yml"

jobs:
  frontend-typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend typecheck
        run: npm run frontend:typecheck

      - name: Run frontend build
        env:
          FANIC_STATIC_OUTPUT_DIR: ${{ github.workspace }}/static
        run: npm run frontend:build
