name: Frontend ESLint

on:
  push:
    paths:
      - "frontend/**/*.ts"
      - "eslint.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-eslint.yml"
  pull_request:
    paths:
      - "frontend/**/*.ts"
      - "eslint.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend-eslint.yml"

jobs:
  frontend-eslint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend eslint
        run: npm run frontend:lint
