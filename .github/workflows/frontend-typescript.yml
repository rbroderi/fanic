name: Frontend TypeScript

on:
  push:
    paths:
      - "frontend/**/*.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.dev.json"
      - ".github/workflows/frontend-typescript.yml"
  pull_request:
    paths:
      - "frontend/**/*.ts"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.dev.json"
      - ".github/workflows/frontend-typescript.yml"

jobs:
  frontend-typescript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend typecheck
        run: npm run frontend:typecheck

      - name: Run frontend build
        env:
          FANIC_STATIC_OUTPUT_DIR: ${{ github.workspace }}/static
        run: npm run frontend:build
