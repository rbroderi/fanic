repos:
  - repo: local
    hooks:
      - id: prek-auto-update
        name: prek-auto-update
        entry: uv run prek auto-update
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        fail_fast: true

  - repo: https://github.com/bwhmather/ssort
    rev: 0.16.0
    hooks:
      - id: ssort

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: fix-byte-order-marker
      - id: check-merge-conflict
      - id: end-of-file-fixer
        exclude: ^static/.*\.svg$
      - id: trailing-whitespace
      - id: mixed-line-ending
        exclude: ^static/.*\.svg$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: debug-statements
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.0-1
    hooks:
      - id: shfmt

  - repo: https://github.com/crate-ci/typos
    rev: v1.45.0
    hooks:
      - id: typos

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format
      - id: taplo-lint

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py314-plus, --keep-runtime-typing]
        files: ^(src|tests)/.*\.py$

  - repo: https://github.com/hadialqattan/pycln
    rev: v2.6.0
    hooks:
      - id: pycln
        args: [src, tests]
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff-check
        args: [--fix, --exclude, typings]
        files: ^(src|tests)/.*\.py$
      - id: ruff-format
        args: [--exclude, typings]
        files: ^(src|tests)/.*\.py$
      - id: ruff-check
        name: ruff-check-post-format
        args: [--exclude, typings]
        files: ^(src|tests)/.*\.py$

  - repo: local
    hooks:
      - id: set-source-permissions
        name: set-source-permissions
        entry: bash scripts/set-source-permissions.sh src
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: forbid-fanic-db
        name: forbid-fanic-db
        entry: bash scripts/forbid-fanic-db.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: sync-static-from-storage
        name: sync-static-from-storage
        entry: bash scripts/sync-from-storage.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: autopep695-format
        name: autopep695-format
        entry: uvx autopep695 format
        language: system
        files: ^(src|tests)/.*\.py$
        stages: [pre-commit]

      - id: vulture
        name: vulture
        entry: uvx vulture src --min-confidence 80 --ignore-names dst,secure,httponly,samesite
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: deptry
        name: deptry
        entry: uvx deptry . --known-first-party fanic --ignore DEP002 --package-module-name-map open-clip-torch=open_clip,pillow-avif-plugin=pillow_avif|pillow_avif_plugin,pillow=PIL
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: refurb
        name: refurb
        entry: uvx ruff check --select FURB --ignore FURB110 src tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: basedpyright
        name: basedpyright
        entry: uvx basedpyright
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ty-check
        name: ty-check
        entry: uvx ty check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: frontend-prettier
        name: frontend-prettier-write
        entry: just frontend format
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: frontend-eslint
        name: frontend-eslint
        entry: just frontend lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: comicinfo-xsd
        name: comicinfo-xsd-v2-check
        entry: uvx --with xmlschema python scripts/validate_comicinfo_xsd.py
        language: system
        files: (^|.*[\\/])([Cc]omic[Ii]nfo|[Cc]omic[Bb]ook[Ii]nfo)\.xml$
        stages: [pre-commit]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline", "--exclude-files", "(^logs/|^extern/)"]
        stages: [pre-commit]
